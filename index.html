<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotara — Catálogo de Produtos Naturais</title>
<style>
:root{
--verde-profundo:#2D6A4F;
--verde-sabvia:#74C69D;
--off-white:#F8F6F1;
--terracota:#C77D5A;
--texto:#1B4332;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--off-white);color:var(--texto);}
header{background:linear-gradient(135deg,var(--verde-profundo),#1B4332);color:#fff;text-align:center;padding:34px 20px 26px;}
header h1{font-size:2rem;letter-spacing:1px;}
header p{opacity:.85;margin-top:6px;font-size:.95rem;}
/* ===== FILTROS FIXOS NO TOPO ===== */
.filtro-wrap{position:sticky;top:0;z-index:50;background:var(--off-white);box-shadow:0 2px 10px rgba(27,67,50,.08);}
.filtro-toggle{width:100%;padding:13px 18px;background:var(--verde-profundo);color:#fff;border:none;font-size:.95rem;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.filtro-toggle:hover{background:#245a43;}
.filtro-painel{padding:16px 18px;display:none;border-bottom:1px solid #e7e2d9;}
.filtro-painel.aberto{display:block;}
.filtro-grupo{margin-bottom:14px;}
.filtro-grupo:last-child{margin-bottom:0;}
.filtro-grupo label{display:block;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#6b7a72;margin-bottom:8px;}
.f-opcoes{display:flex;flex-wrap:wrap;gap:7px;}
.f-opcao{padding:7px 13px;border:2px solid var(--verde-sabvia);border-radius:20px;background:#fff;cursor:pointer;font-size:.82rem;color:var(--texto);transition:.25s;position:relative;overflow:hidden;}
.f-opcao.ativo,.f-opcao:hover{background:var(--verde-profundo);color:#fff;border-color:var(--verde-profundo);transform:translateY(-1px);}
.f-limpar{background:none;border:none;color:var(--terracota);font-weight:600;cursor:pointer;font-size:.85rem;margin-top:4px;}
.f-limpar:hover{text-decoration:underline;}
.busca-wrap{padding:14px 18px;}
.busca-wrap input{width:100%;padding:12px 16px;border:2px solid var(--verde-sabvia);border-radius:30px;font-size:.95rem;outline:none;background:#fff;color:var(--texto);}
.busca-wrap input:focus{border-color:var(--verde-profundo);}
main{max-width:1200px;margin:0 auto;padding:24px 18px 60px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 14px rgba(27,67,50,.08);transition:.25s;cursor:pointer;opacity:0;animation:aparecer .4s forwards;}
.card:hover{transform:translateY(-5px);box-shadow:0 10px 24px rgba(27,67,50,.16);}
@keyframes aparecer{to{opacity:1}}
.img-wrap{position:relative;aspect-ratio:1/1;background:#f0ede6;overflow:hidden;}
.img-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:.3s;}
.card:hover .img-wrap img{transform:scale(1.05);}
.cat-badge{position:absolute;top:10px;left:10px;background:rgba(27,67,50,.85);color:#fff;font-size:.68rem;font-weight:600;padding:4px 9px;border-radius:20px;}
.info{padding:14px;}
.info h3{font-size:.98rem;margin-bottom:6px;color:var(--texto);}
.doencas{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
.doenca-tag{background:var(--verde-sabvia);color:#fff;font-size:.65rem;padding:3px 8px;border-radius:20px;}
.info p{font-size:.82rem;color:#5a6b62;line-height:1.45;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.preco-card{font-size:1.05rem;font-weight:700;color:var(--verde-profundo);margin-bottom:10px;}
.botoes{display:flex;gap:8px;}
.btn{flex:1;text-align:center;padding:10px 8px;border-radius:10px;font-size:.8rem;font-weight:600;cursor:pointer;border:none;text-decoration:none;transition:.2s;}
.btn-add{background:var(--verde-profundo);color:#fff;}
.btn-add:hover{background:#245a43;}
.btn1{background:var(--verde-sabvia);color:#fff;}
.btn1:hover{background:#5cb483;}
/* ===== MODAL DE DETALHES ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(27,67,50,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.aberto{display:flex;}
.modal{background:#fff;border-radius:18px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;position:relative;animation:modalIn .3s;}
@keyframes modalIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-fechar{position:sticky;top:10px;float:right;margin:10px;background:var(--off-white);border:none;width:34px;height:34px;border-radius:50%;font-size:1.2rem;cursor:pointer;color:var(--texto);z-index:2;}
.modal-fechar:hover{background:#e7e2d9;}
.modal-img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f0ede6;}
.modal-corpo{padding:20px;}
.modal-cat{display:inline-block;background:var(--verde-sabvia);color:#fff;font-size:.72rem;font-weight:600;padding:4px 10px;border-radius:20px;margin-bottom:10px;}
.modal-corpo h2{font-size:1.3rem;margin-bottom:8px;color:var(--texto);}
.modal-preco{font-size:1.5rem;font-weight:800;color:var(--verde-profundo);margin-bottom:12px;}
.modal-desc{font-size:.92rem;color:#4a5b52;line-height:1.6;margin-bottom:14px;white-space:pre-line;}
.modal-doencas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
.modal-botoes{display:flex;gap:10px;}
/* ===== CARRINHO ===== */
.cart-fab{position:fixed;bottom:24px;right:24px;width:58px;height:58px;border-radius:50%;background:var(--terracota);color:#fff;font-size:1.5rem;border:none;cursor:pointer;box-shadow:0 6px 18px rgba(199,125,90,.5);z-index:60;transition:.2s;}
.cart-fab:hover{transform:scale(1.08);}
.badge{position:absolute;top:-4px;right:-4px;background:var(--verde-profundo);color:#fff;font-size:.72rem;font-weight:700;min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0 5px;}
.cart-panel{position:fixed;top:0;right:-420px;width:100%;max-width:400px;height:100%;background:#fff;z-index:90;box-shadow:-6px 0 24px rgba(0,0,0,.15);transition:right .35s;display:flex;flex-direction:column;}
.cart-panel.aberto{right:0;}
.cart-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #eee;background:var(--off-white);}
.cart-head h2{font-size:1.1rem;}
.cart-fechar{background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--texto);}
.cart-itens{flex:1;overflow-y:auto;padding:16px 20px;}
.cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f0ede6;}
.cart-item img{width:56px;height:56px;border-radius:10px;object-fit:cover;}
.ci-info{flex:1;}
.ci-nome{font-size:.88rem;font-weight:600;margin-bottom:6px;}
.ci-qtd{display:flex;align-items:center;gap:8px;}
.ci-qtd button{width:26px;height:26px;border-radius:8px;border:1px solid var(--verde-sabvia);background:#fff;cursor:pointer;font-size:1rem;color:var(--texto);}
.ci-qtd button:hover{background:var(--verde-sabvia);color:#fff;}
.ci-qtd span{min-width:20px;text-align:center;font-weight:600;}
.ci-remove{background:none;border:none;color:var(--terracota);font-size:1.2rem;cursor:pointer;}
.cart-vazio{text-align:center;color:#6b7a72;padding:40px 0;}
.cart-foot{padding:18px 20px;border-top:1px solid #eee;background:var(--off-white);}
.cart-total{display:flex;justify-content:space-between;font-weight:700;font-size:1.05rem;margin-bottom:12px;color:var(--texto);}
.cart-checkout{width:100%;padding:14px;background:var(--verde-profundo);color:#fff;border:none;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer;transition:.2s;}
.cart-checkout:hover{background:#245a43;}
.cart-checkout:disabled{background:#b8c9c0;cursor:not-allowed;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--verde-profundo);color:#fff;padding:14px 24px;border-radius:14px;font-size:.9rem;font-weight:600;box-shadow:0 10px 30px rgba(27,67,50,.4);opacity:0;transition:.4s;z-index:120;}
.toast.mostrar{transform:translateX(-50%) translateY(0);opacity:1;}
.vazio{text-align:center;padding:40px;color:#6b7a72;display:none;}
footer{text-align:center;padding:30px 20px;color:#6b7a72;font-size:.9rem;}
</style>
</head>

<main>

</aside>

<div class="modal-overlay" id="modalOverlay">
<div class="modal">

<div class="modal-corpo">

</div>

{nome:"Uxi Amarelo 30ml", cat:"Extratos", desc:"Extrato fitoterápico, não alcoólico.", img:"imagens/uxi_amarelo.png", doencas:["Feminino","Intestino"], preco:"33,75"},
{nome:"Valeriana 30ml", cat:"Extratos", desc:"Extrato fitoterápico de Valeriana officinalis, não alcoólico.", img:"imagens/valeriana.png", doencas:["Sono","Ansiedade"], preco:"33,75"},
{nome:"Vitex 30ml", cat:"Extratos", desc:"Extrato fitoterápico de Vitex agnus-castus, não alcoólico.", img:"imagens/vitex.png", doencas:["Feminino","Hormônios"], preco:"43,50"}
];

// ===== ESTADO DOS FILTROS =====
let ordem = '';
let tipoAtivo = '';
let doencaAtiva = '';
// ===== CARRINHO =====
let carrinho = {};

const grid = document.getElementById('grid');
const vazio = document.getElementById('vazio');
const busca = document.getElementById('busca');
const filtroToggle = document.getElementById('filtroToggle');
const filtroPainel = document.getElementById('filtroPainel');
const filtroOrdem = document.getElementById('filtroOrdem');
const filtroTipo = document.getElementById('filtroTipo');
const filtroDoenca = document.getElementById('filtroDoenca');
const filtroLimpar = document.getElementById('filtroLimpar');
const cartFab = document.getElementById('cartFab');
const cartBadge = document.getElementById('cartBadge');
const cartPanel = document.getElementById('cartPanel');
const cartFechar = document.getElementById('cartFechar');
const cartItens = document.getElementById('cartItens');
const cartTotal = document.getElementById('cartTotal');
const cartCheckout = document.getElementById('cartCheckout');
const toast = document.getElementById('toast');
const modalOverlay = document.getElementById('modalOverlay');
const modalImg = document.getElementById('modalImg');
const modalCat = document.getElementById('modalCat');
const modalNome = document.getElementById('modalNome');
const modalPreco = document.getElementById('modalPreco');
const modalDesc = document.getElementById('modalDesc');
const modalDoencas = document.getElementById('modalDoencas');
const modalAdd = document.getElementById('modalAdd');
const modalWhats = document.getElementById('modalWhats');
const modalFechar = document.getElementById('modalFechar');

function fmtPreco(p){return 'R$ ' + p.preco.replace('.', ',');}

// ===== FILTROS =====
const categorias = [...new Set(produtos.map(p => p.cat))];
categorias.forEach(cat => {
const b = document.createElement('button');
b.className = 'f-opcao';
b.textContent = cat;
b.dataset.tipo = cat;
b.onclick = () => { tipoAtivo = (tipoAtivo === cat) ? '' : cat; atualizarAtivos(); render(); };
filtroTipo.appendChild(b);
});
const doencas = [...new Set(produtos.flatMap(p => p.doencas))].sort();
doencas.forEach(d => {
const b = document.createElement('button');
b.className = 'f-opcao';
b.textContent = d;
b.dataset.doenca = d;
b.onclick = () => { doencaAtiva = (doencaAtiva === d) ? '' : d; atualizarAtivos(); render(); };
filtroDoenca.appendChild(b);
});
filtroOrdem.querySelectorAll('.f-opcao').forEach(b => {
b.onclick = () => { ordem = (ordem === b.dataset.ordem) ? '' : b.dataset.ordem; atualizarAtivos(); render(); };
});
filtroToggle.onclick = () => filtroPainel.classList.toggle('aberto');
filtroLimpar.onclick = () => { ordem = ''; tipoAtivo = ''; doencaAtiva = ''; atualizarAtivos(); render(); };
function atualizarAtivos(){
filtroOrdem.querySelectorAll('.f-opcao').forEach(b => b.classList.toggle('ativo', b.dataset.ordem === ordem));
filtroTipo.querySelectorAll('.f-opcao').forEach(b => b.classList.toggle('ativo', b.dataset.tipo === tipoAtivo));
filtroDoenca.querySelectorAll('.f-opcao').forEach(b => b.classList.toggle('ativo', b.dataset.doenca === doencaAtiva));
}

// ===== RENDER =====
function render(){
const termo = busca.value.trim().toLowerCase();
let lista = produtos.filter(p =>
(!tipoAtivo || p.cat === tipoAtivo) &&
(!doencaAtiva || p.doencas.includes(doencaAtiva)) &&
(!termo || p.nome.toLowerCase().includes(termo) || p.desc.toLowerCase().includes(termo))
);
if(ordem === 'az') lista = [...lista].sort((a,b) => a.nome.localeCompare(b.nome));
if(ordem === 'za') lista = [...lista].sort((a,b) => b.nome.localeCompare(a.nome));
grid.innerHTML = lista.map((p, i) => {
const idx = produtos.indexOf(p);
return `<div class="card" style="animation-delay:${Math.min(i*0.05,0.5)}s" onclick="abrirModal(${idx})">
<div class="img-wrap">
<img src="${p.img}" alt="${p.nome}" loading="lazy">
<span class="cat-badge">${p.cat}</span>
</div>
<div class="info">
<h3>${p.nome}</h3>
<div class="doencas">${p.doencas.map(d => `<span class="doenca-tag">${d}</span>`).join('')}</div>
<div class="preco-card">${fmtPreco(p)}</div>
<p>${p.desc}</p>
<div class="botoes" onclick="event.stopPropagation()">
<button class="btn btn-add" onclick="adicionar(${idx})">+ Adicionar</button>
<a class="btn btn1" target="_blank" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent('Olá!\nTenho interesse no produto: ' + p.nome)}">WhatsApp</a>
</div>
</div>
</div>`;
}).join('');
vazio.style.display = lista.length ? 'none' : 'block';
}

// ===== MODAL DE DETALHES =====
let modalIdx = null;
function abrirModal(idx){
modalIdx = idx;
const p = produtos[idx];
modalImg.src = p.img;
modalImg.alt = p.nome;
modalCat.textContent = p.cat;
modalNome.textContent = p.nome;
modalPreco.textContent = fmtPreco(p);
modalDesc.textContent = p.desc;
modalDoencas.innerHTML = p.doencas.map(d => `<span class="doenca-tag">${d}</span>`).join('');
modalWhats.href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent('Olá!\nTenho interesse no produto: ' + p.nome)}`;
modalOverlay.classList.add('aberto');
document.body.style.overflow = 'hidden';
}
function fecharModal(){
modalOverlay.classList.remove('aberto');
document.body.style.overflow = '';
}
modalFechar.onclick = fecharModal;
modalOverlay.onclick = (e) => { if(e.target === modalOverlay) fecharModal(); };
modalAdd.onclick = () => { if(modalIdx !== null){ adicionar(modalIdx); fecharModal(); } };
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') fecharModal(); });

// ===== CARRINHO =====
function adicionar(i){
carrinho[i] = (carrinho[i] || 0) + 1;
atualizarCarrinho();
mostrarToast();
}
function mudarQtd(i, delta){
carrinho[i] = (carrinho[i] || 0) + delta;
if(carrinho[i] <= 0) delete carrinho[i];
atualizarCarrinho();
}
function remover(i){
delete carrinho[i];
atualizarCarrinho();
}
function atualizarCarrinho(){
const totalItens = Object.values(carrinho).reduce((a,b) => a+b, 0);
cartBadge.textContent = totalItens;
cartCheckout.disabled = totalItens === 0;
renderCarrinho();
}
function renderCarrinho(){
const chaves = Object.keys(carrinho);
if(chaves.length === 0){
cartItens.innerHTML = '<div class="cart-vazio">Seu carrinho está vazio.</div>';
cartTotal.textContent = '0';
return;
}
cartItens.innerHTML = chaves.map(i => {
const p = produtos[i];
const qtd = carrinho[i];
return `<div class="cart-item">
<img src="${p.img}" alt="${p.nome}">
<div class="ci-info">
<div class="ci-nome">${p.nome}</div>
<div class="ci-qtd">
<button onclick="mudarQtd(${i},-1)">−</button>
<span>${qtd}</span>
<button onclick="mudarQtd(${i},1)">+</button>
</div>
</div>
<button class="ci-remove" onclick="remover(${i})">🗑</button>
</div>`;
}).join('');
cartTotal.textContent = chaves.reduce((a,i) => a + carrinho[i], 0);
}
function montarMensagem(){
const linhas = Object.keys(carrinho).map(i => {
const p = produtos[i];
const qtd = carrinho[i];
return qtd > 1 ? `${qtd}x ${p.nome}` : `1x ${p.nome}`;
});
return 'Olá!\nGostaria de fazer um pedido:\n\n' + linhas.join('\n') + '\n\nPoderia me confirmar a disponibilidade?';
}
function finalizar(){
if(Object.keys(carrinho).length === 0) return;
const msg = encodeURIComponent(montarMensagem());
window.open(`https://wa.me/${WHATSAPP}?text=${msg}`, '_blank');
carrinho = {};
atualizarCarrinho();
fecharCarrinho();
}
function abrirCarrinho(){ cartPanel.classList.add('aberto'); }
function fecharCarrinho(){ cartPanel.classList.remove('aberto'); }
cartFab.onclick = abrirCarrinho;
cartFechar.onclick = fecharCarrinho;
cartCheckout.onclick = finalizar;

let toastTimer;
function mostrarToast(){
toast.classList.add('mostrar');
clearTimeout(toastTimer);
toastTimer = setTimeout(() => toast.classList.remove('mostrar'), 2200);
}

busca.addEventListener('input', render);
render();
atualizarCarrinho();
</script>
</body>
</html>
